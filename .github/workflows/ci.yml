# SPDX-License-Identifier: 0BSD
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the whole suite on the tag before publishing.
  workflow_call:
  # Nightly: the full test tier (larger matrices, more property runs, random
  # fast-check seeds) on main.
  schedule:
    - cron: '23 3 * * *'

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  WAV2FLAC_TEST_TIER: >-
    ${{ (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')) && 'full' || 'quick' }}
  WAV2FLAC_REQUIRE_TOOLS: '1'

jobs:
  fmt:
    name: Rust formatting and lints
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      # Stable rustfmt skips lines it cannot wrap without reporting them.
      - name: Line width (max_width from rustfmt.toml)
        run: scripts/check-line-width.sh
      - name: Clippy (native, all targets)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy (wasm32)
        run: cargo clippy --lib --target wasm32-unknown-unknown --locked -- -D warnings

  deny:
    name: Dependency licenses and advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check licenses and advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  msrv:
    name: Rust ${{ matrix.target }} on the MSRV (Cargo.toml rust-version)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm32]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-version from Cargo.toml)
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$v" --profile minimal --target wasm32-unknown-unknown
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-${{ matrix.target }}
      # `+version` overrides rust-toolchain.toml.
      - name: Test (native)
        if: matrix.target == 'native'
        run: cargo +${{ steps.msrv.outputs.version }} test --locked --lib --tests
        env:
          WAV2FLAC_REQUIRE_TOOLS: '0'
      - name: Build (wasm32)
        if: matrix.target == 'wasm32'
        run: cargo +${{ steps.msrv.outputs.version }} build --locked --lib --target wasm32-unknown-unknown

  rust:
    name: Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')) && 180 || 30 }}
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test tools
        run: sudo apt-get update -q && sudo apt-get install -yq flac ffmpeg
      - name: Run Rust tests
        run: cargo test --locked

  js:
    name: JS tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')) && 180 || 30 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: wasm-bindgen + binaryen
        run: scripts/ci-tools.sh
      - name: Test tools
        run: sudo apt-get update -q && sudo apt-get install -yq flac
      - name: Install dependencies
        run: npm ci
      - name: Build the package
        run: npm run build
      - name: Type-check
        run: npm run typecheck
      - name: Native encode example (determinism reference)
        run: cargo build --release --locked --example encode
      - name: Unit tests with coverage
        run: npm run coverage
      - name: Package tests (built ESM/CJS, worker, consumer types)
        run: npm run test:pkg
      - name: Package lint (publint, attw)
        run: npm run lint:pkg
      - name: Upload coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-js
          path: coverage/js
          retention-days: 14

  node-min:
    name: Package on the minimum Node (package.json engines)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build scripts are TypeScript run by Node ≥ 22.18; the package itself
      # promises `engines.node`, so build on a current Node and test on the minimum.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: wasm-bindgen + binaryen
        run: scripts/ci-tools.sh
      - name: Install dependencies
        run: npm ci
      - name: Build the package
        run: npm run build
      - name: Minimum Node from package.json engines
        id: engines
        run: echo "version=$(node -p "require('./package.json').engines.node.replace(/^>=\s*/, '')")" >> "$GITHUB_OUTPUT"
      - name: Switch to the minimum Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.engines.outputs.version }}
      - name: Show the Node version
        run: node --version
      - name: Package tests (built ESM/CJS, worker, consumer types)
        run: npm run test:pkg

  reproducible:
    name: Reproducible package build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out a first copy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: a
      - name: Check out a second copy elsewhere
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: elsewhere/b
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Toolchain (rust-toolchain.toml)
        working-directory: a
        run: rustup toolchain install
      - name: wasm-bindgen + binaryen
        run: a/scripts/ci-tools.sh
      # Two checkouts at different paths with separate target dirs and cargo
      # homes: nothing from the build location may leak into the package.
      - name: Build twice
        run: |
          for d in a elsewhere/b; do
            n=${d##*/}
            if [ "$n" = b ]; then export CARGO_HOME="$RUNNER_TEMP/cargo-b"; mkdir -p "$CARGO_HOME"; fi
            mkdir -p "$RUNNER_TEMP/tgz-$n" # npm pack does not create its destination
            (cd "$d" && npm ci --ignore-scripts && CARGO_TARGET_DIR="$RUNNER_TEMP/t-$n" npm run build \
              && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/tgz-$n")
          done
      - name: Compare
        run: |
          (cd a/pkg && find . -type f | sort | xargs sha256sum) > sums
          (cd elsewhere/b/pkg && sha256sum -c ../../../sums)
          diff <(cd a/pkg && find . -type f | sort) <(cd elsewhere/b/pkg && find . -type f | sort)
          cmp "$RUNNER_TEMP"/tgz-a/*.tgz "$RUNNER_TEMP"/tgz-b/*.tgz

  browser:
    name: Browser + bundlers (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: wasm-bindgen + binaryen
        run: scripts/ci-tools.sh
      - name: Install dependencies
        run: npm ci
      - name: Build the package
        run: npm run build
      - name: Install the Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      # Packed package, unbundled / Vite / webpack; every path must match Node.
      - name: Run browser and bundler tests
        run: npm run test:browser
        env:
          WAV2FLAC_BROWSERS: ${{ matrix.browser }}

  docs:
    name: Docs site (MkDocs, API reference)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Node that Read the Docs uses (.readthedocs.yaml).
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/api-docs/package-lock.json
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # cargo metadata downloads every crate's sources; nothing is compiled.
      - name: Cache the crate registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      # The page is committed so Read the Docs needs no Rust. It depends on
      # Cargo.lock, the crates' license files and scripts/crates.ts.
      - name: Third-party page is up to date
        run: |
          npm run docs:third-party
          git diff --exit-code docs/third-party.md \
            || { echo "::error::docs/third-party.md is out of date; run npm run docs:third-party"; exit 1; }
      - name: Install MkDocs
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q -r docs/requirements.txt
      # Warnings (broken TSDoc links, unknown tags) fail the build.
      - name: Generate the API reference
        run: npm run docs:api
      - name: Build the site like Read the Docs (strict)
        run: cp README.md docs/index.md && "$RUNNER_TEMP/venv/bin/mkdocs" build --strict

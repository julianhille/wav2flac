# SPDX-License-Identifier: 0BSD
# Publishes a release when a `vX.Y.Z` (or `vX.Y.Z-pre`) tag is pushed:
#   1. the tag must match every manifest version and have a dated CHANGELOG
#      section, and the tagged commit must be on main;
#   2. the whole CI suite runs on the tag, with the full test tier;
#   3. the package is built, its package tests run on that build, and the
#      same tarball is published to npm with provenance
#      (npm trusted publishing via OIDC; prereleases go to the `next` tag);
#   4. a GitHub release is created with the CHANGELOG section as its text and
#      the tarball, the wasm and SHA256SUMS attached.
# Cut a release with `node scripts/release.ts prepare X.Y.Z`, then push the
# commit and the tag it prints.
name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tag, versions and changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Versions and changelog match the tag
        run: node scripts/release.ts check "$GITHUB_REF_NAME" notes.md
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: notes.md
          retention-days: 7

  ci:
    name: CI
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  pack:
    name: Build, test and pack
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: wasm-bindgen + binaryen
        run: scripts/ci-tools.sh
      - name: flac CLI (package tests decode the output)
        run: sudo apt-get update -q && sudo apt-get install -yq flac
      - run: npm ci
      - run: npm run build
      - run: npm run lint:pkg
      # The package tests run on exactly the build that gets packed and published.
      - run: npm run test:pkg
        env:
          WAV2FLAC_REQUIRE_TOOLS: '1'
      - name: Pack
        run: |
          mkdir dist
          npm pack --pack-destination dist
          cp pkg/wav2flac.wasm pkg/THIRD_PARTY_LICENSES.txt dist/
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: dist/
          retention-days: 30

  publish:
    name: Publish to npm
    needs: [ci, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Publishing with OIDC (no token secret) needs npm ≥ 11.5.1, which not
      # every Node 24 release bundles.
      - run: npm install --global npm@11.20.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist
      # Publish the tarball the pack job tested, byte for byte.
      - run: (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npm publish dist/*.tgz --provenance --access public --tag "$tag"

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: .
          pattern: release-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md "${pre[@]}" \
            ./*.tgz wav2flac.wasm THIRD_PARTY_LICENSES.txt SHA256SUMS

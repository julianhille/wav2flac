# SPDX-License-Identifier: 0BSD
# cargo-deny configuration: only permissive licenses may end up in the wasm.

[graph]
all-features = false

[licenses]
allow = [
    "0BSD",
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

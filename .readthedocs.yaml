# Read the Docs build: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: '3.12'
    nodejs: '22'
  jobs:
    # The README is the home page; copy it instead of keeping a second copy.
    pre_build:
      - cp README.md docs/index.md
      # API reference from the TSDoc; needs no wasm build (see scripts/api-docs/).
      - npm run docs:api

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
